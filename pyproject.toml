[project]
name = "yubi-deployers"
version = "0.1.0"
description = "Load an Ethereum deployer key with a YubiKey touch and its keystore password"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["eth-account>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["yubi_deployers.py"]  # the package is the loader alone; scripts/ and tests/ stay in the repo

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
