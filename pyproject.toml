[project]
name = "yubi-deployers"
version = "0.1.0"
description = "Ethereum deployer key behind YubiKey touch plus the keystore password"
requires-python = ">=3.12"
dependencies = ["eth-account>=0.13"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
